name: workflow azure-registry

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch: 
env:
  IMAGE_NAME:      aplicacion-java-agc
  IMAGE_TAG:       latest
  DOCKERFILE_PATH: Dockerfile
  ACR_REGISTRY:    labacrgithub.azurecr.io
  
jobs:
  build:
    name: Construir
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Subir artefacto JAR
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Build de la imagen Docker
        run: |
          docker build \
            -t ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -f ${{ env.DOCKERFILE_PATH }} .
        
      - name: Exportar imagen Docker
        run: |
          docker save \
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -o image.tar
            
      - name: Descargar imagen Docker
        uses: actions/download-artifact@v7
        with:
          name: app-jar

      - name: Cargar imagen en Docker
        run: docker load -i image.tar

      - name: Login en Azure Container Registry
        run: |
          docker login ${{ env.ACR_REGISTRY }} \
            -u ${{ secrets.DOCKER_CREDS_USR }} \
            -p ${{ secrets.DOCKER_CREDS_PSW }}

      - name: Tag y Push al ACR
        run: |
          set -eux
          docker tag \
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

          docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Logout del registry
        run: docker logout ${{ env.ACR_REGISTRY }}

